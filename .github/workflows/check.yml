# SPDX-License-Identifier: Apache-2.0
# The protocol, the checker and the examples on every pull request and every change to main (D084).
# In a real browser, only the hostile-input checks run here (D090); the layout checks stay local (D024).
name: check

# Once per pull request, not twice: a branch push alone does not run it, its pull request does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned, not ubuntu-latest: the runner changes when we choose, like the actions below. The job
    # needs only Node, so moving to a newer image is a one-line change once a run on it passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions pinned to a commit, not a tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/protocol.test.mjs

      # Test-only dependency (D091): the skill itself installs nothing. Exact versions from the
      # lockfile, no install scripts.
      - name: Install Playwright and its three browsers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Every page in Chromium, Firefox and WebKit, at desktop, tablet and phone size
        run: npx playwright test

      # A failure that only happens here: print what the browser saw, so it can be read in the log.
      - name: What the browser saw, when a page test failed
        if: failure()
        run: for f in test-results/*/error-context.md; do [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }; done; true

      # The page's promise, proven in the runner's Chrome: a hostile review or answer runs no script,
      # fetches nothing and cannot break out of the exported page. In CI a missing Chrome fails.
      - name: Hostile input in a real browser
        run: |
          CHECKS=hostile node checks/browser/list-page.check.mjs
          CHECKS=hostile node checks/browser/flow-page.check.mjs

      - name: Every example passes the checker
        run: |
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/review.example.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/decision-review.example.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/flow-booking.review.json --root .
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/database-booking.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/retry-backoff.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/booking-race.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/ai-tool-loop.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/password-reset.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/results-layout.review.json
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/salon-booking.review.json --root .
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/salon-desk.review.json --root .
          node skills/letmeshowyousomething/bin/check.mjs review skills/letmeshowyousomething/examples/bakery-website.review.json --root .
          node skills/letmeshowyousomething/bin/check.mjs pair skills/letmeshowyousomething/examples/salon-booking.review.json skills/letmeshowyousomething/examples/salon-booking.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs rounds skills/letmeshowyousomething/examples/salon-booking-round2.review.json skills/letmeshowyousomething/examples/salon-booking.review.json skills/letmeshowyousomething/examples/salon-booking.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs pair skills/letmeshowyousomething/examples/review.example.json skills/letmeshowyousomething/examples/checkout-uat.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs pair skills/letmeshowyousomething/examples/review.example.json skills/letmeshowyousomething/examples/feedback.example.json
          node skills/letmeshowyousomething/bin/check.mjs pair skills/letmeshowyousomething/examples/flow-booking.review.json skills/letmeshowyousomething/examples/flow-booking.feedback.json --root .
          node skills/letmeshowyousomething/bin/check.mjs history skills/letmeshowyousomething/examples/decision-review.example.json skills/letmeshowyousomething/examples/earlier-decisions.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs history skills/letmeshowyousomething/examples/flow-booking.review.json skills/letmeshowyousomething/examples/booking-earlier.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs rounds skills/letmeshowyousomething/examples/checkout-round2.review.json skills/letmeshowyousomething/examples/review.example.json skills/letmeshowyousomething/examples/checkout-uat.feedback.json
          node skills/letmeshowyousomething/bin/check.mjs pair skills/letmeshowyousomething/examples/flow-booking-round2.review.json skills/letmeshowyousomething/examples/flow-booking-round2.feedback.json --root .
          node skills/letmeshowyousomething/bin/check.mjs rounds skills/letmeshowyousomething/examples/flow-booking-round3.review.json skills/letmeshowyousomething/examples/flow-booking.review.json skills/letmeshowyousomething/examples/flow-booking.feedback.json skills/letmeshowyousomething/examples/flow-booking-round2.review.json skills/letmeshowyousomething/examples/flow-booking-round2.feedback.json --root .

      # The example pages are what people open first: they must be what the renderer makes today.
      - name: Example pages are up to date
        run: |
          out="$RUNNER_TEMP/pages"; mkdir -p "$out"
          for pair in review.example.json:checkout-uat decision-review.example.json:decision-review flow-booking.review.json:flow-booking database-booking.review.json:database-booking retry-backoff.review.json:retry-backoff booking-race.review.json:booking-race ai-tool-loop.review.json:ai-tool-loop password-reset.review.json:password-reset results-layout.review.json:results-layout salon-booking.review.json:salon-booking salon-desk.review.json:salon-desk bakery-website.review.json:bakery-website; do
            node skills/letmeshowyousomething/bin/render.mjs "skills/letmeshowyousomething/examples/${pair%%:*}" "$out/${pair##*:}.html" > /dev/null
            cmp -s "$out/${pair##*:}.html" "examples/${pair##*:}.html" \
              || { echo "::error file=examples/${pair##*:}.html::out of date; run: node skills/letmeshowyousomething/bin/render.mjs skills/letmeshowyousomething/examples/${pair%%:*} examples/${pair##*:}.html"; exit 1; }
          done
          # #82 — the continuing examples, each rendered with its earlier rounds.
          F1="skills/letmeshowyousomething/examples/flow-booking.review.json skills/letmeshowyousomething/examples/flow-booking.feedback.json"; F2="skills/letmeshowyousomething/examples/flow-booking-round2.review.json skills/letmeshowyousomething/examples/flow-booking-round2.feedback.json"
          while read -r name earlier; do
            node skills/letmeshowyousomething/bin/render.mjs "skills/letmeshowyousomething/examples/$name.review.json" "$out/$name.html" $earlier > /dev/null
            cmp -s "$out/$name.html" "examples/$name.html" || { echo "::error file=examples/$name.html::out of date; run: node skills/letmeshowyousomething/bin/render.mjs skills/letmeshowyousomething/examples/$name.review.json examples/$name.html $earlier"; exit 1; }
          done <<EOF
          checkout-round2 --earlier skills/letmeshowyousomething/examples/review.example.json skills/letmeshowyousomething/examples/checkout-uat.feedback.json
          salon-booking-round2 --earlier skills/letmeshowyousomething/examples/salon-booking.review.json skills/letmeshowyousomething/examples/salon-booking.feedback.json
          flow-booking-round2 --earlier $F1
          flow-booking-round3 --earlier $F1 --earlier $F2
          EOF
