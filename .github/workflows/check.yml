# SPDX-License-Identifier: Apache-2.0
# The protocol, the checker and the examples on every pull request and every change to main (D084).
# The browser checks stay local (D024): they need Chrome and are never required.
name: check

# Once per pull request, not twice: a branch push alone does not run it, its pull request does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned, not ubuntu-latest: the runner changes when we choose, like the actions below. The job
    # needs only Node, so moving to a newer image is a one-line change once a run on it passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit, not a tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/protocol.test.mjs

      - name: Every example passes the checker
        run: |
          node bin/check.mjs review examples/review.example.json
          node bin/check.mjs review examples/decision-review.example.json
          node bin/check.mjs review examples/flow-booking.review.json --root .
          node bin/check.mjs pair examples/review.example.json examples/checkout-uat.feedback.json
          node bin/check.mjs pair examples/review.example.json examples/feedback.example.json
          node bin/check.mjs history examples/decision-review.example.json examples/earlier-decisions.feedback.json
          node bin/check.mjs history examples/flow-booking.review.json examples/booking-earlier.feedback.json

      # The example pages are what people open first: they must be what the renderer makes today.
      - name: Example pages are up to date
        run: |
          out="$RUNNER_TEMP/pages"; mkdir -p "$out"
          for pair in review.example.json:checkout-uat decision-review.example.json:decision-review flow-booking.review.json:flow-booking; do
            node bin/render.mjs "examples/${pair%%:*}" "$out/${pair##*:}.html" > /dev/null
            cmp -s "$out/${pair##*:}.html" "examples/${pair##*:}.html" \
              || { echo "::error file=examples/${pair##*:}.html::out of date; run: node bin/render.mjs examples/${pair%%:*} examples/${pair##*:}.html"; exit 1; }
          done
