# SPDX-License-Identifier: Apache-2.0
# The workflow pins every action to a commit; Dependabot proposes the new commit when an action
# releases, security fixes included. Its pull requests pass the same check as any other.
# Minor and patch releases come as one pull request per ecosystem a week: one review, and no two
# updates fighting over the same lockfile. A major release still comes alone, so a break has one
# cause; a security fix still comes alone and at once (groups cover version updates only).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
    groups:
      actions:
        update-types: [minor, patch]
  # Playwright and axe, the test-only dependencies (D091).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Tests
    groups:
      test-tools:
        update-types: [minor, patch]
