# Licences for files that cannot carry a comment. Code files carry their own SPDX line.
# Format: https://reuse.software/spec-3.3/
version = 1

[[annotations]]
path = ["schemas/**", "PROTOCOL.md"]
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["examples/**"]
SPDX-License-Identifier = "MIT-0"

[[annotations]]
path = ["README.md", "SKILL.md", "LICENSING.md", "THIRD-PARTY-NOTICES.md", "CONTRIBUTING.md", "AGENTS.md", ".gitignore", "REUSE.toml", "package.json", "package-lock.json"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/**", "conformance/README.md", "conformance/RESULTS.md"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["site/social-preview.png", "site/loop.mp4", "site/loop-poster.jpg", "site/tutorial/*.mp4", "site/tutorial/*.jpg", "site/tutorial/*.gif"]
SPDX-License-Identifier = "Apache-2.0"
